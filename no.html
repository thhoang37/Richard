<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Too bad 😌</title>

  <style>
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1000px 600px at 20% 10%, #ffe1ef 0%, rgba(255,225,239,0) 60%),
                  radial-gradient(900px 600px at 85% 20%, #e8f6ff 0%, rgba(232,246,255,0) 55%),
                  linear-gradient(180deg, #fff7fb 0%, #ffffff 60%, #fff7fb 100%);
      color:#211a1d;
    }
    .card{
      width:min(640px, 92vw);
      padding: 42px 36px;
      border-radius: 28px;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,77,136,.18);
      box-shadow: 0 22px 70px rgba(0,0,0,.14);
      text-align:center;
    }
    h1{ margin:0 0 10px; font-size: 2rem; }
    p{ margin:0 0 22px; font-size:1.1rem; opacity:.9; }

    a.button{
      display:inline-block;
      text-decoration:none;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff4d88, #ff77ab);
      color: white;
      box-shadow: 0 14px 32px rgba(0,0,0,.12);
      transition: transform .12s ease;
    }
    a.button:active{ transform: scale(.98); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Too bad 😌</h1>
    <p>Try again.</p>
    <a class="button" href="./index.html">Back</a>
  </div>
</body>
</html>
