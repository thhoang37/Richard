<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Valentine’s Day Gift 💝</title>

  <style>
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1000px 600px at 20% 10%, #ffe1ef 0%, rgba(255,225,239,0) 60%),
                  radial-gradient(900px 600px at 85% 20%, #e8f6ff 0%, rgba(232,246,255,0) 55%),
                  linear-gradient(180deg, #fff7fb 0%, #ffffff 60%, #fff7fb 100%);
      color:#211a1d;
      padding: 28px 14px;
    }

    .card{
      width:min(860px, 94vw);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,77,136,.18);
      border-radius: 28px;
      padding: 34px 26px;
      box-shadow: 0 22px 70px rgba(0,0,0,.14);
      text-align:center;
    }

    h1{ margin:0 0 10px; font-size: clamp(1.7rem, 3vw, 2.2rem); }
    p{ margin:0 0 18px; font-size: 1.08rem; opacity:.9; }

    .img-wrap{
      margin: 18px auto 10px;
      width: min(720px, 92vw);
      border-radius: 22px;
      overflow:hidden;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 16px 40px rgba(0,0,0,.10);
      background: rgba(255,255,255,.6);
    }

    img{
      width:100%;
      height:auto;
      display:block;
    }

    .buttons{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 20px;
    }

    a.button{
      display:inline-block;
      text-decoration:none;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff4d88, #ff77ab);
      color: white;
      box-shadow: 0 14px 32px rgba(0,0,0,.12);
      transition: transform .12s ease;
    }
    a.button:active{ transform: scale(.98); }

    a.secondary{
      background: rgba(255,255,255,.9);
      color:#211a1d;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 12px 24px rgba(0,0,0,.08);
    }

.gallery{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin: 20px auto 10px;
  width: min(720px, 92vw);
}

@media (max-width: 700px){
  .gallery{
    grid-template-columns: 1fr;
  }
}

    .img-stack{
      display:flex;
      flex-direction:column;
      gap: 26px;              /* space between images */
      margin: 24px auto 10px;
      width: min(720px, 92vw);
    }

.gift-note{
  margin-top: 26px;
  font-size: 1.1rem;
  font-style: italic;
  opacity: .9;
}

/* Floating hearts background */
.hearts{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.7;
}

.heart{
  position:absolute;
  font-size:18px;
  animation: rise 10s linear infinite;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.08));
}

@keyframes rise{
  0%{ transform: translateY(20vh) scale(.9); opacity:0; }
  10%{ opacity:.9; }
  100%{ transform: translateY(-110vh) scale(1.15); opacity:0; }
}
    
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true">
  <div class="heart" style="left:10%; animation-delay:0s;">💗</div>
  <div class="heart" style="left:22%; animation-delay:2s; font-size:22px;">💖</div>
  <div class="heart" style="left:35%; animation-delay:4s;">💞</div>
  <div class="heart" style="left:52%; animation-delay:1s; font-size:20px;">💘</div>
  <div class="heart" style="left:68%; animation-delay:3s;">💓</div>
  <div class="heart" style="left:80%; animation-delay:5s; font-size:24px;">💝</div>
  <div class="heart" style="left:90%; animation-delay:6s;">💗</div>
</div>

  <div class="card">
    <h1>Your Valentine’s Day Gift 💝</h1>
    <p>You deserve all the best life has to offer, I hope this contributes to that 🥰</p>

  <div class="img-stack">
    <div class="img-wrap">
      <img src="./1.jpg" alt="Valentine’s Day gift 1" />
    </div>
    
    <div class="img-wrap">
      <img src="./2.jpg" alt="Valentine’s Day gift 2" />
    </div>
  </div>
    
  <p class="gift-note">
    dw we'll figure out the logistics later 💕
  </p>
  
</body>
</html>
