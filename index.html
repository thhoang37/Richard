<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Be my Valentine?</title>
  <style>
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffe1ef, #fff);
      color:#222;
    }
    .card{
      width:min(520px, 92vw);
      background:#ffffffcc;
      backdrop-filter: blur(6px);
      border:1px solid #ffd0e1;
      border-radius:24px;
      padding:28px;
      box-shadow: 0 16px 60px rgba(0,0,0,.10);
      text-align:center;
    }
    h1{ margin:0 0 8px; font-size: 2rem; }
    p{ margin:0 0 18px; line-height:1.4; }
    .buttons{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
    button{
      border:0; padding:12px 18px; border-radius:999px; font-size:1rem;
      cursor:pointer; transition: transform .08s ease;
    }
    button:active{ transform: scale(.98); }
    #yes{ background:#ff4d88; color:white; }
    #no{ background:#f2f2f2; }
    .note{ font-size:.9rem; opacity:.8; margin-top:14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hi my love💘</h1>
    <p>Will you be my Valentine?</p>

    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙈</button>
    </div>

    <p class="note" id="note"></p>
  </div>

  <script>
    const note = document.getElementById("note");
    const no = document.getElementById("no");
    const yes = document.getElementById("yes");

    yes.addEventListener("click", () => {
      document.querySelector("h1").textContent = "YAY!!! 💞";
      document.querySelector("p").textContent = "Best Valentine ever. See you soon 😘";
      note.textContent = "";
      no.style.display = "none";
      yes.textContent = "🥰";
    });

    const messages = [
      "Are you suuure? 🥺",
      "Please? 💗",
      "I’ll buy you some snacks 🍫",
      "Okay, last chance 😭",
      "You can’t click no forever 😤"
    ];
    let i = 0;

    no.addEventListener("mouseover", () => {
      // Make the "No" button dodge the mouse a bit
      const x = Math.random() * 240 - 120;
      const y = Math.random() * 160 - 80;
      no.style.transform = `translate(${x}px, ${y}px)`;
      note.textContent = messages[i++ % messages.length];
    });
  </script>
</body>
</html>
