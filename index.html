<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Be my Valentine?</title>
  <style>
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
      background: #fff7f9;
      color:#1f1b1c;
    }
    .card{
      width:min(620px, 92vw);
      background:#fff;
      border: 1px solid #f1d7df;
      border-radius: 18px;
      padding: 34px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.10);
      text-align:left;
    }
    h1{ margin:0 0 12px; font-size: 2rem; letter-spacing:.2px; }
    p{ margin:0 0 20px; line-height:1.6; font-size:1.08rem; }
    .buttons{ display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; }
    button{
      border-radius: 12px; border: 1px solid #ead0d8;
      padding: 12px 16px; font-size: 1rem; cursor:pointer;
      background:#fff;
      transition: transform .08s ease, background .2s ease;
    }
    button:active{ transform: scale(.98); }
    #yes{ background:#1f1b1c; color:#fff; border-color:#1f1b1c; }
    #no{ background:#fff; }
    .note{ opacity:.75; font-size:.95rem; }
  </style>

</head>
<body>
  <div class="card">
    <h1>Hi My Sweet Love💘</h1>
    <p>Will you be my Valentine?</p>

    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙈</button>
    </div>

    <p class="note" id="note"></p>
  </div>

  <script>
    const note = document.getElementById("note");
    const no = document.getElementById("no");
    const yes = document.getElementById("yes");

    yes.addEventListener("click", () => {
      document.querySelector("h1").textContent = "YAY!!! 💞";
      document.querySelector("p").textContent = "Best Valentine ever. See you soon 😘";
      note.textContent = "";
      no.style.display = "none";
      yes.textContent = "🥰";
    });

    const messages = [
      "Are you suuure? 🥺",
      "Please? 💗",
      "I’ll buy you some snacks 🍫",
      "Okay, last chance 😭",
      "You can’t click no forever 😤"
    ];
    let i = 0;

    no.addEventListener("mouseover", () => {
      // Make the "No" button dodge the mouse a bit
      const x = Math.random() * 240 - 120;
      const y = Math.random() * 160 - 80;
      no.style.transform = `translate(${x}px, ${y}px)`;
      note.textContent = messages[i++ % messages.length];
    });
  </script>
</body>
</html>
